<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн-кинотеатр</title>
    <script src="https://telegram.org"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f0f13;
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            max-width: 720px;
            margin-bottom: 14px;
        }
        h1 {
            font-size: 20px;
            margin: 0 0 4px 0;
        }
        .meta {
            font-size: 13px;
            color: #9e9ea7;
        }
        .player-box {
            width: 100%;
            max-width: 720px;
            aspect-ratio: 16 / 9;
            background: #1b1b22;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #2c2c35;
            padding: 16px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
        .status {
            text-align: center;
            color: #b0b0ba;
            font-size: 14px;
            line-height: 1.5;
        }
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 16px;
            width: 100%;
            max-width: 720px;
        }
        .btn {
            padding: 12px 20px;
            background: #2ea6ff;
            color: #fff;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
        }
        .btn-secondary {
            background: #2c2c35;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="movie-title">Подготовка...</h1>
        <div class="meta" id="movie-meta">Инициализация плеера</div>
    </div>

    <div class="player-box" id="player-container">
        <div class="status" id="status-text">⏳ Загрузка плеера...</div>
    </div>

    <div class="actions">
        <a id="vk-link" href="#" target="_blank" class="btn btn-secondary" style="display:none;">Найти в VK Видео</a>
        <button class="btn" id="close-btn">Закрыть плеер</button>
    </div>

    <script>
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        } catch (e) {}

        document.getElementById('close-btn').onclick = function() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.close();
            } else {
                window.close();
            }
        };

        const params = new URLSearchParams(window.location.search);
        const title = params.get('title') || 'Фильм';
        const year = params.get('year') || '';
        const embedUrl = params.get('embed') || '';

        document.getElementById('movie-title').innerText = year ? title + ' (' + year + ')' : title;

        const container = document.getElementById('player-container');
        const metaEl = document.getElementById('movie-meta');
        const statusEl = document.getElementById('status-text');
        const vkBtn = document.getElementById('vk-link');

        vkBtn.href = 'https://vkvideo.ru' + encodeURIComponent(title + ' ' + year + ' фильм');
        vkBtn.style.display = 'inline-block';

        if (embedUrl.startsWith('http')) {
            metaEl.innerText = 'Источник: открытый видеокаталог';
            container.innerHTML = '<iframe src="' + embedUrl + '" allow="clipboard-write; autoplay; fullscreen" allowfullscreen></iframe>';
        } else {
            metaEl.innerText = 'Прямой поток в открытом доступе не найден';
            statusEl.innerText = 'Бесплатная версия этого фильма не найдена на Rutube. Воспользуйтесь кнопкой поиска ниже.';
        }
    </script>
</body>
</html>
