<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр фильма</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--tg-theme-bg-color, #181818);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #242424);
            padding: 24px;
            border-radius: 16px;
            max-width: 400px;
            width: 100%;
        }
        h2 { margin-top: 0; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 0;
            margin-top: 16px;
            background-color: var(--tg-theme-button-color, #2ea6ff);
            color: var(--tg-theme-button-text-color, #ffffff);
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="movie-title">Фильм найден</h2>
        <p id="movie-id" style="opacity: 0.6; font-size: 14px;"></p>
        <p>Нажмите кнопку ниже для перехода:</p>
        <button id="kp-btn" class="btn">Смотреть на Кинопоиске</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const params = new URLSearchParams(window.location.search);
        const filmId = params.get('id');
        const title = params.get('title');

        if (title) {
            document.getElementById('movie-title').innerText = title;
        }

        if (filmId) {
            document.getElementById('movie-id').innerText = 'ID на Кинопоиске: ' + filmId;
            document.getElementById('kp-btn').onclick = function() {
                tg.openLink('https://kinopoisk.ru' + filmId + '/');
            };
        } else {
            document.getElementById('movie-id').innerText = 'Ошибка: ID фильма не передан в ссылку';
        }
    </script>
</body>
</html>
